# Generates the native launch splash (shown before Flutter draws its first frame).
# Regenerate: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F5F7F7"
  image: assets/branding/splash_logo.png
  color_dark: "#101413"
  android_12:
    image: assets/branding/splash_android12.png
    icon_background_color: "#0F766E"
    color: "#F5F7F7"
    icon_background_color_dark: "#0F766E"
    color_dark: "#101413"
  android: true
  ios: true
  web: false
  fullscreen: false
